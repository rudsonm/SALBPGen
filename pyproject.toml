[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "salbpgen"
version = "0.2.0"
description = "Reproduction of SALBPGen, an instance generator for the Simple Assembly Line Balancing Problem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
salbpgen = "salbpgen.cli:main"

[tool.setuptools]
packages = ["salbpgen"]
